services:
  - type: web
    name: dukapos-admin
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false          # set this as a secret in the Render dashboard
      - key: ALLOWED_ORIGIN
        value: "*"           # restrict to your domain in production
